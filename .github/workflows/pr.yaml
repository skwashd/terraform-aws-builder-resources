name: Check Terraform

on: 
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tflint:
    runs-on: ubuntu-latest

    name: Lint Terraform

    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: load-plugins
        name: Cache Plugins
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        id: setup-tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        env:
            GITHUB_TOKEN: ${{ github.token }}
        with:
          tflint_version: v0.61.0

      - name: Install Plugins
        id: tflint-plugins
        run: tflint --init

      - name: Lint
        id: tflint
        run: tflint

  terraform-test:
    runs-on: ubuntu-latest

    name: Validate and Test Terraform

    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        id: setup-terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.11"
          terraform_wrapper: false

      - name: Check formatting
        id: fmt
        run: terraform fmt -check -recursive

      - name: Initialize
        id: init
        run: terraform init -backend=false -input=false

      - name: Validate
        id: validate
        run: terraform validate

      - name: Test
        id: test
        run: terraform test

      - name: Remove Terraform Files
        id: rm-tf
        run: rm -rf .terraform .terraform.*

      - name: Check generated docs are up to date
        id: docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .terraform-docs.yml
          fail-on-diff: false # Logic is busted. Skipping!